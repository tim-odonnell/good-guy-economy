<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0b1f2a"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- dossier / document -->
  <g>
    <rect x="30" y="24" width="52" height="66" rx="6" fill="#e6fbff"/>
    <path d="M30 30 a6 6 0 0 1 6 -6 h32 l14 14 v46 a6 6 0 0 1 -6 6 h-40 a6 6 0 0 1 -6 -6 Z"
          fill="#eafeff" stroke="#0b1f2a" stroke-width="0"/>
    <path d="M68 24 v12 a2 2 0 0 0 2 2 h12 Z" fill="#bfeff5"/>
    <line x1="38" y1="46" x2="70" y2="46" stroke="#7dd3e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="56" x2="70" y2="56" stroke="#7dd3e0" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="66" x2="58" y2="66" stroke="#7dd3e0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- connecting-the-dots hint peeking from under the magnifier -->
  <g stroke="#0e7490" stroke-width="2.5" fill="#0e7490">
    <line x1="46" y1="72" x2="64" y2="80" stroke-dasharray="1 4" stroke-linecap="round"/>
    <circle cx="46" cy="72" r="2.4"/>
    <circle cx="64" cy="80" r="2.4"/>
  </g>

  <!-- magnifying glass -->
  <g transform="rotate(15 88 88)">
    <circle cx="82" cy="82" r="24" fill="#fbbf24" stroke="#1b1006" stroke-width="0"/>
    <circle cx="82" cy="82" r="17" fill="none" stroke="#1b1006" stroke-width="5"/>
    <rect x="98" y="96" width="12" height="30" rx="6" fill="#1b1006" transform="rotate(0 104 111)"/>
  </g>
</svg>
